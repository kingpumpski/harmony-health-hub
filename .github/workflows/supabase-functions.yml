name: Supabase edge functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ygqoptvezotdqhtimdkr
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy AI clinical assist function
        run: supabase functions deploy ai-clinical-assist --project-ref "$SUPABASE_PROJECT_REF"
