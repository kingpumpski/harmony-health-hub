name: Supabase edge functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ygqoptvezotdqhtimdkr
    steps:
      - uses: actions/checkout@v4

      # Pin the setup action and CLI version so deployment does not depend on
      # resolving a moving "latest" release during CI. This avoids GitHub
      # release API rate limits and makes the deployment toolchain reproducible.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Validate deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy all edge functions
        shell: bash
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            if [ -d "$dir" ] && [ -f "$dir/index.ts" ]; then
              name="$(basename "$dir")"
              echo "Deploying $name"
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
            fi
          done
