name: Supabase edge functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ygqoptvezotdqhtimdkr
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy all edge functions
        shell: bash
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            if [ -d "$dir" ] && [ -f "$dir/index.ts" ]; then
              name="$(basename "$dir")"
              echo "Deploying $name"
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
            fi
          done
