name: Clean migration replay

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/clean-migration-replay.yml'
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/clean-migration-replay.yml'

permissions:
  contents: read

concurrency:
  group: clean-migration-replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay all migrations on a clean local database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start local Supabase and replay migration chain
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if timeout 20m supabase start 2>&1 | tee /tmp/supabase-start.log; then
              exit 0
            fi
            if grep -Eiq 'SQLSTATE|ERROR: relation .* does not exist|ERROR: column .* does not exist|syntax error at or near|migration .* failed|permission denied|duplicate key value' /tmp/supabase-start.log; then
              echo "Migration replay encountered a deterministic schema/SQL failure; not retrying."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 20))
              echo "Local Supabase startup failed for an infrastructure reason (attempt $attempt/4); retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "Local Supabase did not start after bounded retries."
          exit 1

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
