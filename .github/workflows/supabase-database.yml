name: Supabase database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-hotfix.sql'
      - '.github/workflows/supabase-database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ygqoptvezotdqhtimdkr
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Link project using Supabase management authentication
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply production compatibility hotfix
        run: supabase db query --linked "$(cat supabase/production-hotfix.sql)"
      - name: Apply pending migrations
        run: supabase db push --linked --yes
