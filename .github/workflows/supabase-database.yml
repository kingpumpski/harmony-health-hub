name: Supabase database compatibility

on:
  push:
    branches: [main]
    paths:
      - 'supabase/production-hotfix.sql'
      - '.github/workflows/supabase-database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ygqoptvezotdqhtimdkr
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply production enum compatibility first
        run: supabase db query --linked "ALTER TYPE public.app_role ADD VALUE IF NOT EXISTS 'it_admin';"
      - name: Apply production compatibility SQL
        run: supabase db query --linked "$(cat supabase/production-hotfix.sql)"
      - name: Report migration history drift without mutating history
        run: |
          echo "::warning::Remote migration history contains versions absent from the repository. Automatic db push is intentionally disabled until the migration baseline is reconciled."
