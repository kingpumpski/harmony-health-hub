name: Supabase production compatibility review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-compatibility-review
  cancel-in-progress: false

jobs:
  review-only:
    name: Review archived compatibility SQL (no database access)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify production hotfix is not executable
        shell: bash
        run: |
          set -euo pipefail
          test ! -e supabase/production-hotfix.sql
          test -s docs/engineering/migration-source-candidates/production-hotfix.sql.candidate
          echo "Archived compatibility SQL is retained for review only. No Supabase credentials, project link, or SQL execution is available in this workflow."
