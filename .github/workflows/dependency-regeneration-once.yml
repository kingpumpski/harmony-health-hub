name: Dependency regeneration (one-time)

on:
  push:
    branches:
      - architecture/harmony-national-standard-roadmap

permissions:
  contents: write

jobs:
  regenerate:
    if: "!startsWith(github.event.head_commit.message, '[dependency-regeneration]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Regenerate dependency tree
        run: |
          npm update lodash minimatch brace-expansion --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts
          npm audit --json > npm-audit-after-regeneration.json || true

      - name: Validate lockfile
        run: |
          npm ci --ignore-scripts
          npm run test:dependency-security
          git diff --check

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json npm-audit-after-regeneration.json
          if git diff --cached --quiet; then
            echo "No dependency changes produced by npm."
            exit 0
          fi
          git commit -m "[dependency-regeneration] regenerate patched npm dependency tree"
          git push origin HEAD:architecture/harmony-national-standard-roadmap
