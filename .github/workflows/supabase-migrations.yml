name: Supabase migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose whether to validate, apply, or verify the migration chain'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply
          - verify

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ygqoptvezotdqhtimdkr
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration state
        run: supabase migration list --linked

      - name: Validate migrations
        if: ${{ inputs.mode == 'validate' }}
        run: supabase db push --linked --dry-run

      - name: Apply migrations
        if: ${{ inputs.mode == 'apply' }}
        run: supabase db push --linked

      - name: Verify database lint
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'verify' }}
        run: supabase db lint --linked --fail-on error

      - name: Verify operational schema contract
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'verify' }}
        run: supabase test db --linked supabase/tests/database/operational_read_schema_contract.sql

      - name: Verify security access contract
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'verify' }}
        run: supabase test db --linked supabase/tests/database/security_access_contract.sql

      - name: Verify SECURITY DEFINER authorization contract
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'verify' }}
        run: supabase test db --linked supabase/tests/database/security_definer_auth_contract.sql

      - name: Verify staff directory and notification contract
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'verify' }}
        run: supabase test db --linked supabase/tests/database/staff_directory_notification_contract.sql

      - name: Verify maternity workspace contract
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'verify' }}
        run: supabase test db --linked supabase/tests/database/maternity_workspace_contract.sql

      - name: Verify clinical workspace read contract
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'verify' }}
        run: supabase test db --linked supabase/tests/database/clinical_workspace_read_contract.sql

      - name: Verify operational workspace least-privilege contract
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'verify' }}
        run: supabase test db --linked supabase/tests/database/operational_workspace_least_privilege_contract.sql

      - name: Verify operational workspace module reconciliation contract
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'verify' }}
        run: supabase test db --linked supabase/tests/database/operational_workspace_module_reconciliation_contract.sql

      - name: Verify admission workspace read security contract
