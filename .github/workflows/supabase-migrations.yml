name: Supabase migrations

on:
  push:
    branches:
      - feature/operational-workflow-hardening
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose whether to validate or apply the migration chain'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ygqoptvezotdqhtimdkr
      SUPABASE_CLI_VERSION: latest
      WORKFLOW_MODE: ${{ inputs.mode || 'validate' }}
    steps:
      - name: Checkout repository without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install Supabase CLI without third-party actions
        run: |
          set -euo pipefail
          npm install --global "supabase@${SUPABASE_CLI_VERSION}"
          supabase --version

      - name: Validate migration credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link Harmony database project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration state
        run: supabase migration list --linked

      - name: Validate migrations
        if: ${{ env.WORKFLOW_MODE == 'validate' }}
        run: supabase db push --linked --dry-run

      - name: Apply migrations
        if: ${{ env.WORKFLOW_MODE == 'apply' }}
        run: supabase db push --linked

      - name: Verify database lint
        if: ${{ env.WORKFLOW_MODE == 'apply' }}
        run: supabase db lint --linked --fail-on error
