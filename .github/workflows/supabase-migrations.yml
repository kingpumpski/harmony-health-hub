name: Supabase migrations

on:
  push:
    branches:
      - feature/operational-workflow-hardening
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose whether to validate, apply, or rebuild the migration baseline'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply
          - baseline

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ygqoptvezotdqhtimdkr
      SUPABASE_CLI_VERSION: latest
      WORKFLOW_MODE: ${{ inputs.mode || 'validate' }}
      BASELINE_MODE: ${{ inputs.mode == 'baseline' || contains(github.event.head_commit.message, '[migration-baseline]') }}
    steps:
      - name: Start workflow timer
        run: |
          set -euo pipefail
          echo "WORKFLOW_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          echo "Workflow started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - name: Checkout repository without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Supabase CLI without third-party actions
        run: |
          set -euo pipefail
          npm install --global "supabase@${SUPABASE_CLI_VERSION}"
          supabase --version

      - name: Validate migration credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link Harmony production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Capture live schema backup before baseline repair
        if: ${{ env.BASELINE_MODE == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/harmony-migration-baseline
          supabase db dump --linked --schema public,extensions -f /tmp/harmony-migration-baseline/public-extensions.sql
          supabase db dump --linked --schema supabase_migrations --data-only --use-copy -f /tmp/harmony-migration-baseline/migration-history.sql
          test -s /tmp/harmony-migration-baseline/public-extensions.sql
          test -s /tmp/harmony-migration-baseline/migration-history.sql
          echo "Live schema and migration-history backups captured before repair."

      - name: Archive repository migration chain before baseline repair
        if: ${{ env.BASELINE_MODE == 'true' }}
        run: |
          set -euo pipefail
          archive_dir="supabase/migrations-archive/$(date -u '+%Y%m%dT%H%M%SZ')"
          mkdir -p "$archive_dir"
          if compgen -G 'supabase/migrations/*.sql' > /dev/null; then
            git mv supabase/migrations/*.sql "$archive_dir"/
          fi
          mkdir -p supabase/migrations
          echo "Archived historical repository migrations under $archive_dir"

      - name: Record and clear divergent remote migration history
        if: ${{ env.BASELINE_MODE == 'true' }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee migration-history-before-baseline.txt
          grep -oE '[0-9]{14}' migration-history-before-baseline.txt | sort -u > /tmp/harmony-migration-baseline/remote-versions.txt
          count=$(wc -l < /tmp/harmony-migration-baseline/remote-versions.txt | tr -d ' ')
          echo "Remote migration records discovered: $count"
          test "$count" -gt 0
          while IFS= read -r version; do
            echo "Reverting migration-history record $version (tracking only; no schema rollback)."
            supabase migration repair "$version" --status reverted --linked
          done < /tmp/harmony-migration-baseline/remote-versions.txt
          if grep -qE '[0-9]{14}' <(supabase migration list --linked); then
            echo "Remote migration history was not fully cleared."
            exit 1
          fi

      - name: Generate canonical remote schema baseline
        if: ${{ env.BASELINE_MODE == 'true' }}
        run: |
          set -euo pipefail
          printf 'Y\n' | supabase db pull --linked canonical_remote_schema
          test -n "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"

      - name: Capture storage policy delta without mutating migration history
        if: ${{ env.BASELINE_MODE == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/harmony-migration-baseline
          supabase db dump --linked --schema storage -f /tmp/harmony-migration-baseline/storage.sql
          test -s /tmp/harmony-migration-baseline/storage.sql
          cp /tmp/harmony-migration-baseline/storage.sql supabase/storage-policy-baseline.sql
          echo "Captured storage schema/policies without creating a migration-history record."

      - name: Verify canonical migration history after baseline
        if: ${{ env.BASELINE_MODE == 'true' }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee migration-history-after-baseline.txt
          versions=$(grep -oE '[0-9]{14}' migration-history-after-baseline.txt | sort -u | wc -l | tr -d ' ')
          test "$versions" -eq 1
          supabase db lint --linked --fail-on error

      - name: Commit canonical migration baseline
        if: ${{ env.BASELINE_MODE == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p docs/migrations
          {
            echo '# Migration History Baseline'
            echo
            echo 'This archive was created from the production Supabase project before repairing migration history.'
            echo
            echo '## Pre-repair remote history'
            echo '```text'
            cat migration-history-before-baseline.txt
            echo '```'
            echo
            echo '## Post-repair remote history'
            echo '```text'
            cat migration-history-after-baseline.txt
            echo '```'
            echo
            echo 'The archived migrations remain available under `supabase/migrations-archive/` for audit/reference but are no longer part of the executable migration chain.'
          } > docs/migrations/MIGRATION_HISTORY_BASELINE.md
          git add supabase/migrations supabase/migrations-archive supabase/storage-policy-baseline.sql docs/migrations/MIGRATION_HISTORY_BASELINE.md supabase/config.toml
          git commit -m "chore: establish canonical production migration baseline [migration-baseline-complete]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Show migration state
        if: ${{ env.BASELINE_MODE != 'true' }}
        run: supabase migration list --linked

      - name: Validate migrations
        if: ${{ env.BASELINE_MODE != 'true' && env.WORKFLOW_MODE == 'validate' }}
        run: |
          set -euo pipefail
          echo "Validating migration chain against the linked project."
          supabase db push --linked --dry-run

      - name: Apply migrations
        if: ${{ env.BASELINE_MODE != 'true' && env.WORKFLOW_MODE == 'apply' }}
        run: |
          set -euo pipefail
          supabase db push --linked

      - name: Verify database lint after apply
        if: ${{ env.BASELINE_MODE != 'true' && env.WORKFLOW_MODE == 'apply' }}
        run: supabase db lint --linked --fail-on error

      - name: Report workflow duration
        if: ${{ always() }}
        run: |
          set -euo pipefail
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - WORKFLOW_START_MS))
          duration_seconds=$(awk "BEGIN { printf \"%.3f\", ${duration_ms}/1000 }")
          echo "Workflow completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Total workflow duration: ${duration_seconds}s (${duration_ms}ms)"
