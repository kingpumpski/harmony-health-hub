name: Refresh SheetJS lockfile

on:
  push:
    branches:
      - feature/operational-workflow-hardening
    paths:
      - package.json
      - .github/workflows/refresh-xlsx-lock.yml

permissions:
  contents: read

env:
  SHEETJS_VERSION: 0.20.3

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/operational-workflow-hardening
          fetch-depth: 1

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify SheetJS lock entry
        run: |
          node -e 'const l=require("./package-lock.json"); const p=l.packages["node_modules/xlsx"]; if(!p || p.version !== process.env.SHEETJS_VERSION || !String(p.resolved).includes("cdn.sheetjs.com")) process.exit(1); console.log(p.version, p.resolved);'

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: harmony-health-hub-sheetjs-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
