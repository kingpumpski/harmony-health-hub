name: Refresh SheetJS lockfile

on:
  push:
    branches:
      - feature/operational-workflow-hardening
    paths:
      - package.json
      - .github/workflows/refresh-xlsx-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/operational-workflow-hardening
          fetch-depth: 0

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore: refresh lockfile for patched SheetJS"
          git push origin feature/operational-workflow-hardening
