name: Quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'architecture/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Next-generation contract verification
        run: npm run verify:nextgen

      - name: Next-generation runtime contract tests
        run: npm run test:nextgen-runtime

      - name: Next-generation interoperability fixture tests
        run: npm run test:nextgen-interoperability

      - name: Next-generation communication boundary tests
        run: npm run test:nextgen-communication

      - name: Next-generation clinical workflow boundary tests
        run: npm run test:nextgen-clinical-workflows

      - name: Next-generation EMPI workflow boundary tests
        run: npm run test:nextgen-empi

      - name: Next-generation AI session workflow boundary tests
        run: npm run test:nextgen-ai-session

      - name: Next-generation device lifecycle boundary tests
        run: npm run test:nextgen-device-lifecycle

      - name: Next-generation device integration boundary tests
        run: npm run test:nextgen-device-integration

      - name: Next-generation laboratory device reconciliation tests
        run: npm run test:nextgen-lab-device-reconciliation

      - name: Next-generation appointment concurrency and state-transition tests
        run: npm run test:nextgen-appointment-concurrency

      - name: Next-generation imaging RIS/PACS integrity tests
        run: npm run test:nextgen-imaging-ris-pacs

      - name: Next-generation claims adjudication concurrency and financial tests
        run: npm run test:nextgen-claims-adjudication

      - name: Next-generation medication and pharmacy safety tests
        run: npm run test:nextgen-medication-pharmacy-safety

      - name: Next-generation transfusion safety tests
        run: npm run test:nextgen-transfusion-safety

      - name: Production build
        run: npm run build
