name: Quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 24

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Spreadsheet parser regression
        run: npm run test:spreadsheet-parser

      - name: Operational contract checks
        run: npm run test:contracts

      - name: Clinical report-only access contract
        run: npm run test:clinical-report-access

      - name: Navigation and header UX contract
        run: node scripts/navigation-header-ux-contract.mjs

      - name: Role dashboard contract
        run: npm run test:role-dashboards

      - name: Encounter worklist and route UX contract
        run: npm run test:encounter-worklist-ui

      - name: Sidebar role contract
        run: npm run test:sidebar-roles

      - name: Offline replay security contract
        run: npm run test:offline-replay

      - name: Clinical reference contract checks
        run: npm run test:clinical-references

      - name: Notification provider security contract
        run: npm run test:notification-provider-security

      - name: Public SECURITY DEFINER exposure contract
        run: npm run test:public-security-definer-exposure
      - name: SECURITY DEFINER creation contract
        run: npm run test:security-definer-creation
      - name: Authenticated SECURITY DEFINER exposure contract
        run: npm run test:authenticated-security-definer-exposure
      - name: Authorization boundary contracts
        run: npm run test:authorization-boundaries
      - name: Project integrity release gate
        run: npm run test:project-integrity
      - name: Security best-practice audit
        run: npm run test:security-best-practices
      - name: RLS helper performance contract
        run: npm run test:rls-helper-performance
      - name: Public view security contract
        run: npm run test:public-view-security
      - name: Dependency security contract
        run: npm run test:dependency-security

      - name: Patient Hub facility context contract
        run: npm run test:patient-hub-facility-context

      - name: Patient Hub read-only RPC contract
        run: npm run test:patient-hub-readonly-rpc

      - name: Patient Hub read RPC GET compatibility contract
        run: npm run test:patient-hub-read-rpc-get-compatibility

      - name: Patient Hub section-load error contract
        run: npm run test:patient-hub-section-load-errors

      - name: Encounter facility-context reassertion contract
        run: npm run test:encounter-facility-context-reassertion

      - name: Encounter workflow workspace facility contract
        run: npm run test:encounter-workflow-workspace-facility

      - name: Encounter worklist RPC contract
        run: npm run test:encounter-worklist-rpc

      - name: Encounter clinical context facility contract
        run: npm run test:encounter-clinical-context-facility

      - name: Encounter clerking facility contract
        run: npm run test:encounter-clerking-facility

      - name: Encounter lifecycle facility contract
        run: npm run test:encounter-lifecycle-facility

      - name: Encounter admission and order facility contract
        run: npm run test:encounter-admission-order-facility

      - name: Direct patient order facility contract
        run: npm run test:direct-patient-order-facility

      - name: Service order and invoice facility contract
        run: npm run test:service-order-invoice-facility

      - name: Billing workflow facility contract
        run: npm run test:billing-workflow-facility

      - name: Insurance claim facility contract
        run: npm run test:insurance-claim-facility

      - name: Encounter diagnosis facility contract
        run: npm run test:encounter-diagnosis-facility

      - name: Pharmacy workspace UI contract
        run: npm run test:pharmacy-workspace-ui

      - name: Role dashboard KPI semantic contract
        run: node scripts/role-dashboard-kpi-semantic-contract.mjs

      - name: Production build
        run: npm run build
