name: Quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 24

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Spreadsheet parser regression
        run: npm run test:spreadsheet-parser

      - name: Operational contract checks
        run: npm run test:contracts

      - name: Clinical report-only access contract
        run: npm run test:clinical-report-access

      - name: Navigation and header UX contract
        run: node scripts/navigation-header-ux-contract.mjs

      - name: Role dashboard contract
        run: npm run test:role-dashboards

      - name: Encounter worklist and route UX contract
        run: npm run test:encounter-worklist-ui

      - name: Sidebar role contract
        run: npm run test:sidebar-roles

      - name: Offline replay security contract
        run: npm run test:offline-replay

      - name: Clinical reference contract checks
        run: npm run test:clinical-references

      - name: Notification provider security contract
        run: npm run test:notification-provider-security

      - name: Public SECURITY DEFINER exposure contract
        run: npm run test:public-security-definer-exposure
      - name: SECURITY DEFINER creation contract
        run: npm run test:security-definer-creation
      - name: Authenticated SECURITY DEFINER exposure contract
        run: npm run test:authenticated-security-definer-exposure
      - name: Authorization boundary contracts
        run: npm run test:authorization-boundaries
      - name: Project integrity release gate
        run: npm run test:project-integrity
      - name: Security best-practice audit
        run: npm run test:security-best-practices
      - name: RLS helper performance contract
        run: npm run test:rls-helper-performance
      - name: Public view security contract
        run: npm run test:public-view-security
      - name: Dependency security contract
        run: npm run test:dependency-security

      - name: Role dashboard KPI semantic contract
        run: node scripts/role-dashboard-kpi-semantic-contract.mjs

      - name: Production build
        run: npm run build
