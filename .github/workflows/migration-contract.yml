name: Migration contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/migration-contract.mjs'
      - '.github/workflows/migration-contract.yml'
  push:
    branches: [main, 'feature/**', 'fix/**', 'ci/**']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/migration-contract.mjs'
      - '.github/workflows/migration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-contract:
    name: Schema and security contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate legacy schema compatibility contract and security
        if: hashFiles('scripts/migration-contract.mjs') != ''
        run: node scripts/migration-contract.mjs
      - name: Explain skipped static contract
        if: hashFiles('scripts/migration-contract.mjs') == ''
        run: echo "Static migration contract is not present on this legacy PR branch; clean replay still runs, and the full contract is required on branches that include the contract assets."

  database-contract:
    name: Clean database migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Docker Hub authentication avoids anonymous pull quotas when repository secrets are configured.
      - name: Authenticate to Docker Hub for Supabase image pulls
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Start local Supabase services
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 3m supabase start 2>&1 | tee /tmp/supabase-start.log; then
              exit 0
            fi
            if grep -Eiq 'SQLSTATE|invalid input value for enum|ERROR: relation .* does not exist|ERROR: column .* does not exist|syntax error at or near|migration .* failed|permission denied|duplicate key value' /tmp/supabase-start.log; then
              echo "Supabase startup reached a deterministic migration/schema/security failure; stopping retries so the SQL failure stays visible."
              exit 1
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 30))
              echo "Supabase startup failed for an infrastructure reason (attempt $attempt/4); retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "Supabase failed to start after bounded retries; migration replay was not run."
          exit 1
      - name: Replay the full migration chain on a clean database
        timeout-minutes: 35
        run: supabase db reset
      - name: Verify live schema, RPC return types, privileges and RLS
        if: hashFiles('supabase/tests/database/migration_contract.sql') != ''
        timeout-minutes: 10
        run: supabase test db supabase/tests/database/migration_contract.sql
      - name: Verify HR/payroll employee query columns and record controls
        if: hashFiles('supabase/tests/database/hr_payroll_record_management_contract.sql') != ''
        timeout-minutes: 10
        run: supabase test db supabase/tests/database/hr_payroll_record_management_contract.sql
      - name: Explain skipped database contract
        if: hashFiles('supabase/tests/database/migration_contract.sql') == ''
        run: echo "Database contract SQL is not present on this legacy PR branch; migration replay remains required."
