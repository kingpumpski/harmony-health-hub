name: Migration contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'docs/engineering/migration-collision-*-2026-11-27.md'
      - 'docs/engineering/active-role-dashboard-search-path-hardening-2026-11-27.md'
      - 'scripts/migration-contract.mjs'
      - 'scripts/migration-*.mjs'
      - 'scripts/*facility-repair-contract.mjs'
      - 'scripts/*forward-repair-contract.mjs'
      - 'scripts/active-dashboard-role-search-path-contract.mjs'
      - '.github/workflows/migration-contract.yml'
      - '.github/workflows/supabase-migrations.yml'
      - 'package.json'
  push:
    branches: [main, 'feature/**', 'fix/**', 'ci/**', 'chore/**']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'docs/engineering/migration-collision-*-2026-11-27.md'
      - 'docs/engineering/active-role-dashboard-search-path-hardening-2026-11-27.md'
      - 'scripts/migration-contract.mjs'
      - 'scripts/migration-*.mjs'
      - 'scripts/*facility-repair-contract.mjs'
      - 'scripts/*forward-repair-contract.mjs'
      - 'scripts/active-dashboard-role-search-path-contract.mjs'
      - '.github/workflows/migration-contract.yml'
      - '.github/workflows/supabase-migrations.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Schema and security contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Regression-test forward-only migration enforcement
        run: node scripts/migration-forward-only-regression.mjs
      - name: Enforce immutable history and forward version ordering on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/migration-forward-only-contract.mjs origin/${{ github.base_ref }}
      - run: npm ci
      - name: Verify migration validation failure semantics
        run: npm run test:migration-parity
      - name: Validate migration identities and required contract assets
        run: npm run test:migration-contract

  database-contract:
    name: Clean database migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate migration identities before starting database services
        run: node scripts/migration-contract.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase services
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if supabase start 2>&1 | tee /tmp/supabase-start.log; then
              exit 0
            fi
            if grep -Eiq 'SQLSTATE|ERROR: relation .* does not exist|syntax error at or near|migration .* failed' /tmp/supabase-start.log; then
              echo "Supabase startup reached a deterministic migration/schema error; stopping retries so the SQL failure stays visible."
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 20))
              echo "Supabase image pull/start failed (attempt $attempt/4); retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "Supabase failed to start after bounded retries; migration replay was not run."
          exit 1
      - name: Replay the full migration chain on a clean database
        run: supabase db reset
      - name: Verify live schema, RPC return types, privileges and RLS
        timeout-minutes: 10
        run: supabase test db supabase/tests/database
