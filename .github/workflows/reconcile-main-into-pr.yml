name: Reconcile main into PR 274

on:
  push:
    branches:
      - architecture/harmony-national-standard-roadmap

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge and reconcile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # Prefer the PR branch only for true textual conflicts; non-conflicting
          # changes from main are retained by Git's normal three-way merge.
          git merge origin/main --no-edit --no-commit -X ours

          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const ours = JSON.parse(execFileSync('git', ['show','HEAD:package.json'], {encoding:'utf8'}));
          const theirs = JSON.parse(execFileSync('git', ['show','origin/main:package.json'], {encoding:'utf8'}));
          const merged = { ...theirs, ...ours };
          merged.scripts = { ...(theirs.scripts || {}), ...(ours.scripts || {}) };
          merged.dependencies = { ...(theirs.dependencies || {}), ...(ours.dependencies || {}) };
          merged.devDependencies = { ...(theirs.devDependencies || {}), ...(ours.devDependencies || {}) };
          fs.writeFileSync('package.json', JSON.stringify(merged, null, 2) + '\n');

          const prLock = execFileSync('git', ['show','HEAD:bun.lock'], {encoding:'utf8'});
          let mainLock = execFileSync('git', ['show','origin/main:bun.lock'], {encoding:'utf8'});
          const prVite = prLock.split('\n').find((line) => line.startsWith('    "vite": ["vite@'));
          if (!prVite) throw new Error('PR Vite lock entry not found');
          const lines = mainLock.split('\n');
          const viteIndex = lines.findIndex((line) => line.startsWith('    "vite": ["vite@'));
          if (viteIndex < 0) throw new Error('main Vite lock entry not found');
          lines[viteIndex] = prVite;
          fs.writeFileSync('bun.lock', lines.join('\n'));
          NODE

          git add package.json bun.lock
          git rm -f .github/workflows/reconcile-main-into-pr.yml
          git add -A

          git commit -m "chore: reconcile main into PR #274"
          git push origin HEAD:architecture/harmony-national-standard-roadmap
