<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmony Health Hub</title>
  </head>
  <body>
    <script>
      // GitHub Pages serves this document for unknown BrowserRouter paths.
      // Preserve the project base and requested route, then let index.html restore it.
      (function () {
        var parts = window.location.pathname.split('/').filter(Boolean);
        var base = parts.length ? '/' + parts[0] : '';
        var route = '/' + parts.slice(1).join('/');
        var target = base + '/?route=' + encodeURIComponent(route + window.location.search + window.location.hash);
        window.location.replace(target);
      }());
    </script>
    <p>Loading Harmony Health Hub…</p>
  </body>
</html>
